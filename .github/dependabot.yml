version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Microsoft.Extensions.* and EF Core carry an 8.0.x (net8.0) and a 10.0.x (net10.0) entry in
    # Directory.Packages.props. Ignoring major bumps keeps each line within its major version;
    # moving to a new major (e.g. when adding net11.0) is a deliberate manual change.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      aspire:
        patterns:
          - "Aspire.*"
      azure:
        patterns:
          - "Azure.*"
      reqnroll:
        patterns:
          - "Reqnroll*"
      test-packages:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Testing.Extensions.*"
          - "Testcontainers*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
